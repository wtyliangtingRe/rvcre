[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rvcre"
version = "0.1.0"
description = "Local voice design, synthesis and conversion with reusable voice profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "soundfile>=0.13,<1",
  "librosa>=0.11,<0.12", "pydantic>=2.10,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "PyYAML>=6,<7", "filelock>=3.16,<5",
]

[project.optional-dependencies]
ui = ["gradio==6.31.0", "httpx[socks]>=0.28,<1"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11"]
asr = ["faster-whisper>=1.1,<2"]

[project.scripts]
rvcre = "rvcre.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rvcre"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
